<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声迹 · 实时转写</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="logo">≋</span><span>声迹<small>LIVE TRANSCRIPT</small></span></a>
    <div class="side-label">转写日期 <span id="dayCount">0 天</span></div>
    <nav id="days" aria-label="有记录的日期"></nav>
    <p class="side-note" id="retention">正在读取归档信息…</p>
  </aside>
  <main>
    <header><div><span class="eyebrow">LIVE TRANSCRIPT</span><h1>实时转写</h1><p>按时间阅读，打开即定位最新。</p></div><span class="live" id="connection"><i></i><span id="syncState">正在连接…</span></span></header>
    <section class="toolbar" aria-label="查询条件">
      <div><label for="date">转写日期</label><div class="date-controls"><input type="date" id="date"><button id="today" class="outline" type="button">今天</button></div></div>
      <form id="searchForm"><label for="query">搜索当日内容</label><div class="search"><input type="search" id="query" placeholder="输入关键词，按回车搜索" maxlength="500"><button type="submit">搜索</button></div></form>
      <button id="refresh" class="outline" type="button">刷新</button><a id="export" class="download" href="/api/export">↓ 导出当日文本</a>
    </section>
    <section class="transcript-panel" aria-labelledby="listTitle">
      <div class="panel-header"><div><h2 id="listTitle">当天转写</h2><span id="recordInfo">按时间正序 · 最新在底部</span></div><label class="follow"><input id="follow" type="checkbox" checked>自动跟随</label></div>
      <div class="panel-meta" aria-label="查询结果统计"><span><strong id="total">—</strong> 条转写</span><span><strong id="characters">—</strong> 字</span><span id="scope">当天全部内容</span><span class="latest-time">最新 <strong id="latest">—</strong></span></div>
      <p id="notice" role="status" aria-live="polite">正在读取转写内容…</p>
      <div id="reader" class="transcript-reader" role="region" aria-label="当日全部转写文本，可向上滚动查看历史" tabindex="0"><div id="records" class="transcript-sheet"></div></div>
      <div class="panel-footer"><div class="reader-status"><span id="readingState">等待转写内容</span><span id="lastSync">等待同步</span></div><button id="newResults" class="new-results" type="button" hidden></button></div>
    </section>
    <footer>时间使用采集端时区 <span id="timezone"></span><span>向上查看历史 · 最新内容追加在底部</span></footer>
  </main>
</body>
</html>
