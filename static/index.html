<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声迹 · 实时转写</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="logo">≋</span><span>声迹<small>LIVE TRANSCRIPT</small></span></a>
    <div class="side-label">转写日期 <span id="dayCount">0 天</span></div>
    <nav id="days" aria-label="有记录的日期"></nav>
    <p class="side-note" id="retention">正在读取归档信息…</p>
  </aside>
  <main>
    <header><div><span class="eyebrow">RTSP / ASR · LIVE</span><h1>实时转写</h1><p>当天的全部对话，按时间连续呈现。</p></div><span class="live" id="connection"><i></i><span id="syncState">正在连接…</span></span></header>
    <section class="toolbar" aria-label="查询条件">
      <div><label for="date">转写日期</label><div class="date-controls"><input type="date" id="date"><button id="today" class="outline" type="button">今天</button></div></div>
      <form id="searchForm"><label for="query">搜索当日内容</label><div class="search"><input type="search" id="query" placeholder="输入关键词，按回车搜索" maxlength="500"><button type="submit">搜索</button></div></form>
      <button id="refresh" class="outline" type="button">刷新</button><a id="export" class="download" href="/api/export">↓ 导出当日文本</a>
    </section>
    <section class="stats" aria-label="查询结果统计">
      <div><span>转写记录</span><strong id="total">—</strong><small id="scope">当天全部内容</small></div>
      <div><span>转写字数</span><strong id="characters">—</strong><small>仅展示有内容的识别结果</small></div>
      <div><span>最近一条转写</span><strong id="latest">—</strong><small id="lastSync">等待同步</small></div>
    </section>
    <section class="timeline"><div class="section-title"><div><h2 id="listTitle">当天转写</h2><span id="recordInfo">自动更新 · 每 2 秒检查</span></div><label class="follow"><input id="follow" type="checkbox" checked>跟随最新</label></div>
      <p id="notice" role="status" aria-live="polite">正在读取转写内容…</p>
      <div id="records"></div>
    </section>
    <footer>显示 ASR 完成后的有效文本 · 时间使用采集端时区 <span id="timezone"></span></footer>
  </main>
  <button id="newResults" class="new-results" type="button" hidden></button>
</body>
</html>
